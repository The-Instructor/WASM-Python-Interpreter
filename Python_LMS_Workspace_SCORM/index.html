<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Assignment Workspace</title>
    <!-- CodeMirror 5 CSS & Themes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
    <!-- xterm.js stylesheets -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="toolbar">
        <div class="toolbar-left">
            <button id="toggle-sidebar-btn" class="tool-btn" onclick="toggleSidebar()" title="Toggle File Tree">📁 Files</button>
            <div class="brand">Python Lab Workspace</div>
        </div>
        <div class="toolbar-center">
            <button id="action-btn" class="run-btn" onclick="toggleExecution()">▶ Run Code</button>
            <span id="save-indicator" class="save-indicator">Saved</span>
        </div>
        <div class="toolbar-right">
            <button id="exit-btn" class="exit-btn" onclick="returnToCourse()">✕ Exit Lab</button>
        </div>
    </header>

    <main id="workspace">
        <!-- LEFT: File Tree Sidebar -->
        <aside id="file-sidebar">
            <div class="sidebar-header">
                <span>Explorer</span>
                <div class="sidebar-actions">
                    <button id="new-file-btn" onclick="createNewFile()" title="New File">+ File</button>
                    <button id="new-folder-btn" onclick="createNewFolder()" title="New Folder">+ Folder</button>
                    <button id="download-btn" class="tool-btn" onclick="downloadSelected()" title="Download Selected" disabled>📥</button>
                </div>
            </div>
            <ul id="file-list" class="file-list"></ul>
        </aside>

        <!-- Sidebar Splitter Handle -->
        <div class="splitter" id="sidebar-splitter"></div>

        <!-- CENTER: Editor (Top) & Terminal (Bottom) -->
        <section id="center-pane">
            <div id="editor-container">
                <div class="editor-wrapper" id="editor-wrapper">
                    <textarea id="code-editor-textarea"></textarea>
                </div>
                <div id="editor-statusbar">
                    <span id="status-cursor">Ln 1, Col 1</span>
                    <span id="status-selection"></span>
                    <span id="status-indent">Spaces: 4</span>
                    <span id="status-mode">Python</span>
                </div>
            </div>
            <!-- Vertical Splitter Handle -->
            <div class="splitter-horizontal" id="vertical-splitter"></div>
            <div id="terminal-container"></div>
        </section>

        <!-- Instructions Splitter Handle -->
        <div class="splitter" id="instructions-splitter"></div>

        <!-- RIGHT: Assignment Instructions (Markdown) -->
        <aside id="instructions-pane">
            <div class="instructions-header">
                <span>Assignment Instructions</span>
                <div class="instructions-actions">
                    <button class="tool-btn" onclick="openInstructionsNewTab()" title="Open in new tab">↗ New Tab</button>
                    <button id="toggle-instructions-btn" class="tool-btn" onclick="toggleInstructionsPane()" title="Collapse instructions" aria-label="Collapse instructions">◀</button>
                </div>
            </div>
            <div id="instructions-content" class="markdown-body">Loading instructions...</div>
        </aside>
    </main>

    <!-- Floating Expand Button for Instructions when collapsed -->
    <button id="expand-instructions-floating" class="tool-btn" onclick="toggleInstructionsPane()" title="Expand Instructions">▶</button>

    <!-- CodeMirror 5 Core & Addons CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/trailingspace.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/match-highlighter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/indent-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/anyword-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/continuation.min.js"></script>

    <!-- xterm.js core & FitAddon CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <!-- JSZip via CDN for zipping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
