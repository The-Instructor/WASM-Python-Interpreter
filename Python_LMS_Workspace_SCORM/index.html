<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Assignment Workspace</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- xterm.js stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header id="toolbar">
        <div class="toolbar-left">
            <button id="toggle-sidebar-btn" class="tool-btn" onclick="toggleSidebar()" title="Toggle File Tree">📁 Files</button>
            <div class="brand">Python Lab Workspace</div>
        </div>
        <div class="toolbar-right">
            <button id="action-btn" class="run-btn" onclick="toggleExecution()">▶ Run Code</button>
            <button id="exit-btn" class="exit-btn" onclick="returnToCourse()">✕ Exit Lab</button>
        </div>
    </header>

    <main id="workspace">
        <!-- LEFT: File Tree Sidebar -->
        <aside id="file-sidebar">
            <div class="sidebar-header">
                <span>Explorer</span>
                <button id="new-file-btn" onclick="createNewFile()">+ File</button>
            </div>
            <ul id="file-list" class="file-list"></ul>
        </aside>

        <!-- Sidebar Splitter Handle -->
        <div class="splitter" id="sidebar-splitter"></div>

        <!-- CENTER: Editor (Top) & Terminal (Bottom) -->
        <section id="center-pane">
            <div id="editor-container">
                <textarea id="code-editor" oninput="updateActiveFileContent()" placeholder="Select a file from the sidebar..."></textarea>
            </div>
            <!-- Vertical Splitter Handle -->
            <div class="splitter-horizontal" id="vertical-splitter"></div>
            <div id="terminal-container"></div>
        </section>

        <!-- Instructions Splitter Handle -->
        <div class="splitter" id="instructions-splitter"></div>

        <!-- RIGHT: Assignment Instructions (Markdown) -->
        <aside id="instructions-pane">
            <div class="instructions-header">Assignment Instructions</div>
            <div id="instructions-content" class="markdown-body">Loading instructions...</div>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
