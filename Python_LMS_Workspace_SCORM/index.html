<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Wasm Workspace</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- xterm.js stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body>
    <header id="toolbar">
        <div class="brand">Python Wasm Workspace</div>
        <button id="action-btn" class="run-btn" onclick="toggleExecution()">▶ Run Code</button>
    </header>

    <main id="workspace">
        <section id="editor-pane">
            <textarea id="code-editor">
import time
print("Initializing Python environment...")
for i in range(3):
    print(f"Step {i+1} completed.")
    time.sleep(0.4)
print("Execution finished successfully!")</textarea>
        </section>
        <section id="terminal-pane">
            <div id="terminal-container"></div>
        </section>
    </main>

    <!-- xterm.js core library -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
