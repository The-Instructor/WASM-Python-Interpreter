<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Wasm Workspace</title>
    
    <!-- Load Official Pyodide Wasm Runtime -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js"></script>
    
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --border-color: #333333;
            --text-color: #dcdcdc;
            --accent-color: #0e639c;
            --success-color: #2ea44f;
            --hover-color: #2a2d2e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Toolbar */
        header {
            height: 48px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.run-btn {
            background-color: var(--success-color);
            color: white;
            font-weight: bold;
            border: none;
        }
        button.run-btn:hover {
            background-color: #2c974b;
        }
        button.run-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* 3-Column Resizable Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 220px 6px 1fr 6px 380px;
            flex: 1;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        .pane {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background-color: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Resizable Splitter Bars */
        .splitter {
            background-color: var(--border-color);
            cursor: col-resize;
            transition: background 0.2s;
        }
        .splitter:hover, .splitter.active {
            background-color: var(--accent-color);
        }

        /* File List Sidebar */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        .file-item {
            padding: 9px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
        }
        .file-item:hover {
            background-color: var(--hover-color);
        }
        .file-item.active {
            background-color: #37373d;
            border-left-color: var(--accent-color);
        }

        /* Editor Pane */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }
        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none;
            padding: 16px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
            user-select: text;
        }

        /* Terminal Console Pane with Inline Input Support */
        .terminal-pane {
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            flex: 1;
            overflow: hidden;
        }
        .console-container {
            flex: 1;
            padding: 14px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }
        .console-input-row {
            display: none;
            padding: 8px 14px;
            background-color: #252526;
            border-top: 1px solid var(--border-color);
            align-items: center;
            gap: 8px;
        }
        .console-input-row span {
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            color: #4ec9b0;
            white-space: nowrap;
        }
        .console-input-row input {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            padding: 4px 8px;
            outline: none;
            user-select: text;
        }
    </style>
</head>
<body>

    <!-- Top Action Toolbar -->
    <header>
        <div class="toolbar-group">
            <strong>Python Wasm Workspace</strong>
        </div>
        <div class="toolbar-group">
            <button onclick="createNewFile()">+ New File</button>
            <button class="run-btn" id="run-btn" onclick="runCode()" disabled>Loading Python...</button>
        </div>
    </header>

    <!-- Workspace Grid Container -->
    <div class="workspace" id="workspace">
        
        <!-- Left: File System Explorer -->
        <div class="pane">
            <div class="pane-header">Files</div>
            <ul class="file-list" id="file-list"></ul>
        </div>

        <!-- Splitter 1 -->
        <div class="splitter" id="splitter-1"></div>

        <!-- Middle: Code Editor -->
        <div class="pane editor-container">
            <div class="pane-header">
                <span id="current-filename">main.py</span>
                <span style="font-size: 10px; color: #888;">python</span>
            </div>
            <textarea id="code-editor" placeholder="Write your Python code here..."></textarea>
        </div>

        <!-- Splitter 2 -->
        <div class="splitter" id="splitter-2"></div>

        <!-- Right: Console Output & Inline Input Terminal -->
        <div class="pane terminal-pane">
            <div class="pane-header">Terminal Output</div>
            <div class="console-container" id="output-box">Initializing WebAssembly Python environment...</div>
            <div class="console-input-row" id="console-input-row">
                <span id="input-prompt-label">Input:</span>
                <input type="text" id="console-input-field" placeholder="Type your input and press Enter..." onkeydown="handleInputKey(event)">
                <button onclick="submitConsoleInput()" style="padding: 4px 10px; font-size: 11px;">Send</button>
            </div>
        </div>

    </div>

    <script>
        // Virtual File System State
        let files = {
            "main.py": {
                content: '# Test interactive console input()\nname = input("What is your name? ")\nprint(f"Hello, {name}!")\n\nage = int(input("How old are you? "))\nprint(f"Next year you will be {age + 1} years old.")'
            },
            "math_utils.py": {
                content: '# Reusable math helper module\n\ndef factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n'
            }
        };

        let currentFile = "main.py";
        let pyodide = null;
        let activeInputResolver = null;

        // Initialize Pyodide Wasm Runtime & Bridge stream inputs
        async function initWasm() {
            const outputBox = document.getElementById("output-box");
            const runBtn = document.getElementById("run-btn");
            try {
                pyodide = await loadPyodide();
                
                // Expose JS bridge module to handle input requests cleanly
                pyodide.registerJsModule("browser_input", {
                    input: async (promptText = "") => {
                        return await requestConsoleInput(promptText);
                    }
                });

                outputBox.innerText = "Python WebAssembly environment ready. Click 'Run Code'.";
                runBtn.innerText = "▶ Run Code";
                runBtn.disabled = false;
            } catch (err) {
                outputBox.innerText = "Failed to load Pyodide Wasm runtime: " + err;
            }
        }

        // Manage inline terminal prompt display and input resolution
        function requestConsoleInput(promptText) {
            return new Promise((resolve) => {
                const outputBox = document.getElementById("output-box");
                const inputRow = document.getElementById("console-input-row");
                const inputField = document.getElementById("console-input-field");
                const promptLabel = document.getElementById("input-prompt-label");

                if (promptText) {
                    outputBox.innerText += promptText;
                    outputBox.scrollTop = outputBox.scrollHeight;
                }

                promptLabel.innerText = promptText || "input:";
                inputRow.style.display = "flex";
                inputField.value = "";
                inputField.focus();

                activeInputResolver = (value) => {
                    outputBox.innerText += value + "\n";
                    outputBox.scrollTop = outputBox.scrollHeight;
                    inputRow.style.display = "none";
                    resolve(value);
                };
            });
        }

        function submitConsoleInput() {
            const inputField = document.getElementById("console-input-field");
            if (activeInputResolver) {
                let resolver = activeInputResolver;
                activeInputResolver = null;
                resolver(inputField.value);
            }
        }

        function handleInputKey(event) {
            if (event.key === "Enter") {
                submitConsoleInput();
            }
        }

        function initFileSystem() {
            const listEl = document.getElementById("file-list");
            listEl.innerHTML = "";
            for (let filename in files) {
                let li = document.createElement("li");
                li.className = `file-item ${filename === currentFile ? 'active' : ''}`;
                li.innerHTML = `<span>${filename}</span>`;
                li.onclick = () => selectFile(filename);
                listEl.appendChild(li);
            }
            document.getElementById("code-editor").value = files[currentFile].content;
            document.getElementById("current-filename").innerText = currentFile;
        }

        function saveCurrentFileContent() {
            if (files[currentFile]) {
                files[currentFile].content = document.getElementById("code-editor").value;
            }
        }

        function selectFile(filename) {
            saveCurrentFileContent();
            currentFile = filename;
            initFileSystem();
        }

        function createNewFile() {
            saveCurrentFileContent();
            let name = prompt("Enter new Python filename (e.g., script.py):", "script.py");
            if (name) {
                if (!name.endsWith(".py")) name += ".py";
                if (!files[name]) {
                    files[name] = { content: `# New Python script: ${name}\nprint("Hello from ${name}!")` };
                }
                selectFile(name);
            }
        }

        // Execute active Python code securely using module compilation to avoid syntax/indentation errors
        async function runCode() {
            saveCurrentFileContent();
            if (!pyodide) return;

            let outputBox = document.getElementById("output-box");
            outputBox.innerText = `Executing ${currentFile}...\n\n`;

            try {
                // Sync all virtual files into Pyodide VFS layer
                for (let filename in files) {
                    pyodide.FS.writeFile(filename, files[filename].content);
                }

                // Compile and execute code safely via standard namespace execution
                let runnerScript = `
import asyncio
import io
import sys
from browser_input import input as js_input

async def _workspace_runner():
    sys.stdout = io.StringIO()
    sys.stderr = io.StringIO()
    
    async def async_input(prompt_text=""):
        return await js_input(prompt_text)

    import builtins
    builtins.input = async_input

    global_ns = {"__name__": "__main__", "__file__": ${JSON.stringify(currentFile)}}

    try:
        with open(${JSON.stringify(currentFile)}, "r") as f:
            code_str = f.read()
        
        # Compile as module code to gracefully support statements, inputs, and controls
        compiled_code = compile(code_str, ${JSON.stringify(currentFile)}, "exec")
        exec(compiled_code, global_ns)
    except Exception:
        import traceback
        traceback.print_exc()

    return sys.stdout.getvalue(), sys.stderr.getvalue()

await _workspace_runner()
`;

                let [stdout, stderr] = await pyodide.runPythonAsync(runnerScript);

                let result = "";
                if (stdout) result += stdout;
                if (stderr) result += "\n[stderr]:\n" + stderr;

                outputBox.innerText += "\n" + (result || "Program executed successfully with no output.");
                outputBox.scrollTop = outputBox.scrollHeight;
            } catch (err) {
                outputBox.innerText += "\n[Execution Error]:\n" + err;
            }
        }

        // Resizable Splitter Logic
        function setupSplitters() {
            const workspace = document.getElementById("workspace");
            let activeSplitter = null;
            let leftWidth = 220;
            let rightWidth = 380;

            function updateGrid() {
                workspace.style.gridTemplateColumns = `${leftWidth}px 6px 1fr 6px ${rightWidth}px`;
            }

            document.getElementById("splitter-1").onmousedown = (e) => { activeSplitter = 1; e.preventDefault(); };
            document.getElementById("splitter-2").onmousedown = (e) => { activeSplitter = 2; e.preventDefault(); };

            window.onmousemove = (e) => {
                if (!activeSplitter) return;
                let rect = workspace.getBoundingClientRect();

                if (activeSplitter === 1) {
                    leftWidth = Math.max(150, Math.min(450, e.clientX - rect.left));
                } else if (activeSplitter === 2) {
                    rightWidth = Math.max(250, Math.min(600, rect.right - e.clientX));
                }
                updateGrid();
            };

            window.onmouseup = () => { activeSplitter = null; };
        }

        window.onload = () => {
            initFileSystem();
            setupSplitters();
            initWasm();
        };
    </script>
</body>
</html>
