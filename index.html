<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Wasm Workspace</title>
    
    <!-- Load Latest Pyodide Wasm Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/pyodide@0.29.3/full/pyodide.js"></script>
    
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --border-color: #333333;
            --text-color: #dcdcdc;
            --accent-color: #0e639c;
            --success-color: #2ea44f;
            --hover-color: #2a2d2e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Toolbar */
        header {
            height: 48px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.run-btn {
            background-color: var(--success-color);
            color: white;
            font-weight: bold;
            border: none;
        }
        button.run-btn:hover {
            background-color: #2c974b;
        }
        button.run-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* 3-Column Resizable Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 220px 6px 1fr 6px 380px;
            flex: 1;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        .pane {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background-color: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Resizable Splitter Bars */
        .splitter {
            background-color: var(--border-color);
            cursor: col-resize;
            transition: background 0.2s;
        }
        .splitter:hover, .splitter.active {
            background-color: var(--accent-color);
        }

        /* File List Sidebar */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        .file-item {
            padding: 9px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
        }
        .file-item:hover {
            background-color: var(--hover-color);
        }
        .file-item.active {
            background-color: #37373d;
            border-left-color: var(--accent-color);
        }

        /* Editor Pane */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }
        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none;
            padding: 16px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
            user-select: text;
        }

        /* Terminal Console Pane */
        .console-container {
            flex: 1;
            background-color: #1e1e1e;
            padding: 14px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }
    </style>
</head>
<body>

    <!-- Top Action Toolbar -->
    <header>
        <div class="toolbar-group">
            <strong>Python Wasm Workspace</strong>
        </div>
        <div class="toolbar-group">
            <button onclick="createNewFile()">+ New File</button>
            <button class="run-btn" id="run-btn" onclick="runCode()" disabled>Loading Python...</button>
        </div>
    </header>

    <!-- Workspace Grid Container -->
    <div class="workspace" id="workspace">
        
        <!-- Left: File System Explorer -->
        <div class="pane">
            <div class="pane-header">Files</div>
            <ul class="file-list" id="file-list"></ul>
        </div>

        <!-- Splitter 1 -->
        <div class="splitter" id="splitter-1"></div>

        <!-- Middle: Code Editor -->
        <div class="pane editor-container">
            <div class="pane-header">
                <span id="current-filename">main.py</span>
                <span style="font-size: 10px; color: #888;">python</span>
            </div>
            <textarea id="code-editor" placeholder="Write your Python code here..."></textarea>
        </div>

        <!-- Splitter 2 -->
        <div class="splitter" id="splitter-2"></div>

        <!-- Right: Console Output -->
        <div class="pane">
            <div class="pane-header">Terminal Output</div>
            <div class="console-container" id="output-box">Initializing WebAssembly Python environment...</div>
        </div>

    </div>

    <script>
        // Virtual File System State
        let files = {
            "main.py": {
                content: 'import sys\nimport math_utils\n\nprint("Hello from Wasm Python Workspace!")\nprint(f"Python Version: {sys.version.split()[0]}\\n")\n\n# Test cross-module import\nres = math_utils.factorial(5)\nprint(f"Computed factorials via module: 5! = {res}")'
            },
            "math_utils.py": {
                content: '# Reusable math helper module\n\ndef factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n'
            }
        };

        let currentFile = "main.py";
        let pyodide = null;

        // Initialize Pyodide Wasm Runtime
        async function initWasm() {
            const outputBox = document.getElementById("output-box");
            const runBtn = document.getElementById("run-btn");
            try {
                pyodide = await loadPyodide();
                outputBox.innerText = "Python WebAssembly environment ready. Click 'Run Code'.";
                runBtn.innerText = "▶ Run Code";
                runBtn.disabled = false;
            } catch (err) {
                outputBox.innerText = "Failed to load Pyodide Wasm runtime: " + err;
            }
        }

        function initFileSystem() {
            const listEl = document.getElementById("file-list");
            listEl.innerHTML = "";
            for (let filename in files) {
                let li = document.createElement("li");
                li.className = `file-item ${filename === currentFile ? 'active' : ''}`;
                li.innerHTML = `<span>${filename}</span>`;
                li.onclick = () => selectFile(filename);
                listEl.appendChild(li);
            }
            document.getElementById("code-editor").value = files[currentFile].content;
            document.getElementById("current-filename").innerText = currentFile;
        }

        function saveCurrentFileContent() {
            if (files[currentFile]) {
                files[currentFile].content = document.getElementById("code-editor").value;
            }
        }

        function selectFile(filename) {
            saveCurrentFileContent();
            currentFile = filename;
            initFileSystem();
        }

        function createNewFile() {
            saveCurrentFileContent();
            let name = prompt("Enter new Python filename (e.g., script.py):", "script.py");
            if (name) {
                if (!name.endsWith(".py")) name += ".py";
                if (!files[name]) {
                    files[name] = { content: `# New Python script: ${name}\nprint("Hello from ${name}!")` };
                }
                selectFile(name);
            }
        }

        // Execute active Python code inside browser Wasm with virtual filesystem mapping
        async function runCode() {
            saveCurrentFileContent();
            if (!pyodide) return;

            let outputBox = document.getElementById("output-box");
            outputBox.innerText = `Executing ${currentFile}...\n\n`;

            try {
                // Sync all virtual files into Pyodide's virtual filesystem memory layer
                for (let filename in files) {
                    pyodide.FS.writeFile(filename, files[filename].content);
                }

                // Capture standard output streams
                pyodide.runPython(`
                    import io, sys
                    sys.stdout = io.StringIO()
                    sys.stderr = io.StringIO()
                `);

                // Execute the code for the active file
                pyodide.runPython(files[currentFile].content);

                let stdout = pyodide.runPython("sys.stdout.getvalue()");
                let stderr = pyodide.runPython("sys.stderr.getvalue()");

                let result = "";
                if (stdout) result += stdout;
                if (stderr) result += "\n[stderr]:\n" + stderr;

                outputBox.innerText = result || "Program executed successfully with no output.";
            } catch (err) {
                outputBox.innerText = err;
            }
        }

        // Robust State-Based Resizable Splitter Logic
        function setupSplitters() {
            const workspace = document.getElementById("workspace");
            let activeSplitter = null;
            let leftWidth = 220;
            let rightWidth = 380;

            function updateGrid() {
                workspace.style.gridTemplateColumns = `${leftWidth}px 6px 1fr 6px ${rightWidth}px`;
            }

            document.getElementById("splitter-1").onmousedown = (e) => { activeSplitter = 1; e.preventDefault(); };
            document.getElementById("splitter-2").onmousedown = (e) => { activeSplitter = 2; e.preventDefault(); };

            window.onmousemove = (e) => {
                if (!activeSplitter) return;
                let rect = workspace.getBoundingClientRect();

                if (activeSplitter === 1) {
                    leftWidth = Math.max(150, Math.min(450, e.clientX - rect.left));
                } else if (activeSplitter === 2) {
                    rightWidth = Math.max(250, Math.min(600, rect.right - e.clientX));
                }
                updateGrid();
            };

            window.onmouseup = () => { activeSplitter = null; };
        }

        window.onload = () => {
            initFileSystem();
            setupSplitters();
            initWasm();
        };
    </script>
</body>
</html>
