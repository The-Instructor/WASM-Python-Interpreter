<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Wasm Workspace</title>
    
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --border-color: #333333;
            --text-color: #dcdcdc;
            --accent-color: #0e639c;
            --success-color: #2ea44f;
            --hover-color: #2a2d2e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 48px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.run-btn {
            background-color: var(--success-color);
            color: white;
            font-weight: bold;
            border: none;
        }
        button.run-btn:hover {
            background-color: #2c974b;
        }
        button.run-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .workspace {
            display: grid;
            grid-template-columns: 220px 6px 1fr 6px 380px;
            flex: 1;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        .pane {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background-color: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .splitter {
            background-color: var(--border-color);
            cursor: col-resize;
            transition: background 0.2s;
        }
        .splitter:hover, .splitter.active {
            background-color: var(--accent-color);
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        .file-item {
            padding: 9px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
        }
        .file-item:hover {
            background-color: var(--hover-color);
        }
        .file-item.active {
            background-color: #37373d;
            border-left-color: var(--accent-color);
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }
        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none;
            padding: 16px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
            user-select: text;
        }

        .terminal-pane {
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            flex: 1;
            overflow: hidden;
        }
        .console-container {
            flex: 1;
            padding: 14px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }
        .console-input-row {
            display: none;
            padding: 8px 14px;
            background-color: #252526;
            border-top: 1px solid var(--border-color);
            align-items: center;
            gap: 8px;
        }
        .console-input-row span {
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            color: #4ec9b0;
            white-space: nowrap;
        }
        .console-input-row input {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            padding: 4px 8px;
            outline: none;
            user-select: text;
        }
    </style>
</head>
<body>

    <header>
        <div class="toolbar-group">
            <strong>Python Wasm Workspace</strong>
        </div>
        <div class="toolbar-group">
            <button onclick="createNewFile()">+ New File</button>
            <button class="run-btn" id="run-btn" onclick="runCode()" disabled>Loading Python...</button>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <div class="pane">
            <div class="pane-header">Files</div>
            <ul class="file-list" id="file-list"></ul>
        </div>

        <div class="splitter" id="splitter-1"></div>

        <div class="pane editor-container">
            <div class="pane-header">
                <span id="current-filename">main.py</span>
                <span style="font-size: 10px; color: #888;">python</span>
            </div>
            <textarea id="code-editor" placeholder="Write your Python code here..."></textarea>
        </div>

        <div class="splitter" id="splitter-2"></div>

        <div class="pane terminal-pane">
            <div class="pane-header">Terminal Output</div>
            <div class="console-container" id="output-box">Initializing WebAssembly Python environment...</div>
            <div class="console-input-row" id="console-input-row">
                <span id="input-prompt-label">Input:</span>
                <input type="text" id="console-input-field" placeholder="Type your input and press Enter..." onkeydown="handleInputKey(event)">
                <button onclick="submitConsoleInput()" style="padding: 4px 10px; font-size: 11px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        let files = {
            "main.py": {
                content: '# Test standard synchronous input()\nname = input("What is your name? ")\nprint(f"Hello, {name}!")\n\nage = int(input("How old are you? "))\nprint(f"Next year you will be {age + 1} years old.")'
            },
            "math_utils.py": {
                content: '# Reusable math helper module\n\ndef factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n'
            }
        };

        let currentFile = "main.py";
        let worker = null;

        // Initialize Web Worker with Pyodide and SharedArrayBuffer synchronization
        const workerCode = `
            importScripts("https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js");

            let pyodide = null;
            let sab = null;
            let int32View = null;

            async function init() {
                pyodide = await loadPyodide({
                    stdin: () => {
                        postMessage({ type: "REQUEST_INPUT" });
                        Atomics.wait(int32View, 0, 0);
                        let len = int32View[0];
                        int32View[0] = 0;
                        
                        let dataView = new Uint8Array(sab, 4, len);
                        let decoder = new TextDecoder();
                        return decoder.decode(dataView) + "\\n";
                    },
                    stdout: (text) => {
                        postMessage({ type: "STDOUT", text: text + "\\n" });
                    },
                    stderr: (text) => {
                        postMessage({ type: "STDERR", text: text + "\\n" });
                    }
                });
                postMessage({ type: "READY" });
            }

            init();

            onmessage = async (e) => {
                const msg = e.data;
                if (msg.type === "INIT_SAB") {
                    sab = msg.sab;
                    int32View = new Int32Array(sab);
                } else if (msg.type === "RUN") {
                    const { filename, codeFiles } = msg;
                    try {
                        for (let fname in codeFiles) {
                            pyodide.FS.writeFile(fname, codeFiles[fname]);
                        }
                        await pyodide.runPythonAsync(\`
                            import traceback
                            try:
                                with open("\${filename}", "r") as f:
                                    exec(f.read(), {"__name__": "__main__"})
                            except Exception:
                                traceback.print_exc()
                        \`);
                        postMessage({ type: "DONE" });
                    } catch (err) {
                        postMessage({ type: "STDERR", text: err.toString() + "\\n" });
                        postMessage({ type: "DONE" });
                    }
                }
            };
        `;

        const blob = new Blob([workerCode], { type: "application/javascript" });
        worker = new Worker(URL.createObjectURL(blob));

        const sab = new SharedArrayBuffer(1024);
        const int32View = new Int32Array(sab);
        worker.postMessage({ type: "INIT_SAB", sab: sab });

        worker.onmessage = (e) => {
            const msg = e.data;
            const outputBox = document.getElementById("output-box");
            const runBtn = document.getElementById("run-btn");

            if (msg.type === "READY") {
                outputBox.innerText = "Python WebAssembly environment ready. Click 'Run Code'.";
                runBtn.innerText = "▶ Run Code";
                runBtn.disabled = false;
            } else if (msg.type === "STDOUT" || msg.type === "STDERR") {
                outputBox.innerText += msg.text;
                outputBox.scrollTop = outputBox.scrollHeight;
            } else if (msg.type === "REQUEST_INPUT") {
                showConsoleInput();
            } else if (msg.type === "DONE") {
                runBtn.disabled = false;
                runBtn.innerText = "▶ Run Code";
            }
        };

        function showConsoleInput() {
            const inputRow = document.getElementById("console-input-row");
            const inputField = document.getElementById("console-input-field");
            inputRow.style.display = "flex";
            inputField.value = "";
            inputField.focus();
        }

        function submitConsoleInput() {
            const inputField = document.getElementById("console-input-field");
            const inputRow = document.getElementById("console-input-row");
            const outputBox = document.getElementById("output-box");
            const val = inputField.value;

            outputBox.innerText += val + "\n";
            outputBox.scrollTop = outputBox.scrollHeight;
            inputRow.style.display = "none";

            let encoder = new TextEncoder();
            let bytes = encoder.encode(val);
            let targetView = new Uint8Array(sab, 4, bytes.length);
            targetView.set(bytes);

            int32View[0] = bytes.length;
            Atomics.notify(int32View, 0, 1);
        }

        function handleInputKey(event) {
            if (event.key === "Enter") {
                submitConsoleInput();
            }
        }

        function initFileSystem() {
            const listEl = document.getElementById("file-list");
            listEl.innerHTML = "";
            for (let filename in files) {
                let li = document.createElement("li");
                li.className = `file-item ${filename === currentFile ? 'active' : ''}`;
                li.innerHTML = `<span>${filename}</span>`;
                li.onclick = () => selectFile(filename);
                listEl.appendChild(li);
            }
            document.getElementById("code-editor").value = files[currentFile].content;
            document.getElementById("current-filename").innerText = currentFile;
        }

        function saveCurrentFileContent() {
            if (files[currentFile]) {
                files[currentFile].content = document.getElementById("code-editor").value;
            }
        }

        function selectFile(filename) {
            saveCurrentFileContent();
            currentFile = filename;
            initFileSystem();
        }

        function createNewFile() {
            saveCurrentFileContent();
            let name = prompt("Enter new Python filename (e.g., script.py):", "script.py");
            if (name) {
                if (!name.endsWith(".py")) name += ".py";
                if (!files[name]) {
                    files[name] = { content: `# New Python script: ${name}\nprint("Hello from ${name}!")` };
                }
                selectFile(name);
            }
        }

        function runCode() {
            saveCurrentFileContent();
            const outputBox = document.getElementById("output-box");
            const runBtn = document.getElementById("run-btn");

            outputBox.innerText = `Executing ${currentFile}...\n\n`;
            runBtn.disabled = true;
            runBtn.innerText = "Running...";

            let codeFiles = {};
            for (let fname in files) {
                codeFiles[fname] = files[fname].content;
            }

            worker.postMessage({
                type: "RUN",
                filename: currentFile,
                codeFiles: codeFiles
            });
        }

        function setupSplitters() {
            const workspace = document.getElementById("workspace");
            let activeSplitter = null;
            let leftWidth = 220;
            let rightWidth = 380;

            function updateGrid() {
                workspace.style.gridTemplateColumns = `${leftWidth}px 6px 1fr 6px ${rightWidth}px`;
            }

            document.getElementById("splitter-1").onmousedown = (e) => { activeSplitter = 1; e.preventDefault(); };
            document.getElementById("splitter-2").onmousedown = (e) => { activeSplitter = 2; e.preventDefault(); };

            window.onmousemove = (e) => {
                if (!activeSplitter) return;
                let rect = workspace.getBoundingClientRect();

                if (activeSplitter === 1) {
                    leftWidth = Math.max(150, Math.min(450, e.clientX - rect.left));
                } else if (activeSplitter === 2) {
                    rightWidth = Math.max(250, Math.min(600, rect.right - e.clientX));
                }
                updateGrid();
            };

            window.onmouseup = () => { activeSplitter = null; };
        }

        window.onload = () => {
            initFileSystem();
            setupSplitters();
        };
    </script>
</body>
</html>
