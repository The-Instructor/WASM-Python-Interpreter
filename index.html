<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasm & Multi-Language Dev Workspace</title>
    
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --border-color: #333333;
            --text-color: #dcdcdc;
            --accent-color: #0e639c;
            --success-color: #2ea44f;
            --hover-color: #2a2d2e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Toolbar */
        header {
            height: 48px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select, button {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        select:focus, button:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.run-btn {
            background-color: var(--success-color);
            color: white;
            font-weight: bold;
            border: none;
        }
        button.run-btn:hover {
            background-color: #2c974b;
        }

        /* Scalable 3-Column Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 220px 6px 1fr 6px 380px;
            flex: 1;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        .pane {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background-color: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Resizable Splitter Bars */
        .splitter {
            background-color: var(--border-color);
            cursor: col-resize;
            transition: background 0.2s;
        }
        .splitter:hover, .splitter.active {
            background-color: var(--accent-color);
        }

        /* 1. File System Sidebar */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        .file-item {
            padding: 9px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
        }
        .file-item:hover {
            background-color: var(--hover-color);
        }
        .file-item.active {
            background-color: #37373d;
            border-left-color: var(--accent-color);
        }

        /* 2. Middle Editor Pane */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }
        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none;
            padding: 16px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        /* 3. Right Console Pane */
        .console-container {
            flex: 1;
            background-color: #1e1e1e;
            padding: 14px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- Top Navigation & Controls Toolbar -->
    <header>
        <div class="toolbar-group">
            <strong>Dev Workspace</strong>
            <select id="lang-select" onchange="switchLanguage()">
                <option value="python">Python</option>
                <option value="cpp">C++</option>
                <option value="java">Java</option>
            </select>
        </div>
        <div class="toolbar-group">
            <button onclick="createNewFile()">+ New File</button>
            <button class="run-btn" onclick="runCode()">▶ Run Code</button>
        </div>
    </header>

    <!-- Scalable 3-Column Resizable Layout -->
    <div class="workspace" id="workspace">
        
        <!-- Left: File System Explorer -->
        <div class="pane">
            <div class="pane-header">Files</div>
            <ul class="file-list" id="file-list"></ul>
        </div>

        <!-- Splitter 1 -->
        <div class="splitter" id="splitter-1"></div>

        <!-- Middle: Code Editor -->
        <div class="pane editor-container">
            <div class="pane-header">
                <span id="current-filename">main.py</span>
                <span id="file-lang-badge" style="font-size: 10px; color: #888;">python</span>
            </div>
            <textarea id="code-editor" placeholder="Write your code here..."></textarea>
        </div>

        <!-- Splitter 2 -->
        <div class="splitter" id="splitter-2"></div>

        <!-- Right: Console / Terminal Output -->
        <div class="pane">
            <div class="pane-header">Terminal Output</div>
            <div class="console-container" id="output-box">Workspace loaded successfully. Select a file and click "Run Code".</div>
        </div>

    </div>

    <script>
        // Real Virtual File System state
        let files = {
            "main.py": {
                lang: "python",
                content: 'import sys\n\nprint("Hello from Python!")\nprint(f"Python Version: {sys.version.split()[0]}")\n\n# Calculate squares\nfor i in range(5):\n    print(f"{i} squared = {i**2}")'
            },
            "main.cpp": {
                lang: "cpp",
                content: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello from C++!" << endl;\n    for(int i=0; i<5; i++) {\n        cout << "Count: " << i << endl;\n    }\n    return 0;\n}'
            },
            "Main.java": {
                lang: "java",
                content: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello from Java!");\n        for(int i=0; i<5; i++) {\n            System.out.println("Iteration: " + i);\n        }\n    }\n}'
            }
        };

        let currentFile = "main.py";

        function initFileSystem() {
            const listEl = document.getElementById("file-list");
            listEl.innerHTML = "";
            for (let filename in files) {
                let li = document.createElement("li");
                li.className = `file-item ${filename === currentFile ? 'active' : ''}`;
                li.innerHTML = `<span>${filename}</span>`;
                li.onclick = () => selectFile(filename);
                listEl.appendChild(li);
            }
            document.getElementById("code-editor").value = files[currentFile].content;
            document.getElementById("current-filename").innerText = currentFile;
            let lang = files[currentFile].lang;
            document.getElementById("lang-select").value = lang;
            document.getElementById("file-lang-badge.innerText") = lang;
        }

        function saveCurrentFileContent() {
            if (files[currentFile]) {
                files[currentFile].content = document.getElementById("code-editor").value;
            }
        }

        function selectFile(filename) {
            saveCurrentFileContent();
            currentFile = filename;
            initFileSystem();
        }

        function switchLanguage() {
            saveCurrentFileContent();
            let newLang = document.getElementById("lang-select").value;
            files[currentFile].lang = newLang;

            // Update extension automatically
            let ext = newLang === "python" ? "py" : (newLang === "cpp" ? "cpp" : "java");
            let baseName = currentFile.split('.')[0];
            if (newLang === "java") baseName = "Main"; // Java convention
            let newFilename = `${baseName}.${ext}`;

            if (newFilename !== currentFile) {
                files[newFilename] = files[currentFile];
                delete files[currentFile];
                currentFile = newFilename;
                initFileSystem();
            }
        }

        function createNewFile() {
            saveCurrentFileContent();
            let name = prompt("Enter new filename (e.g. script.py, solution.cpp, Program.java):", "script.py");
            if (name && !files[name]) {
                let ext = name.split('.').pop().toLowerCase();
                let lang = ext === "py" ? "python" : (ext === "cpp" ? "cpp" : "java");
                files[name] = { lang: lang, content: `// New ${lang} file` };
                selectFile(name);
            }
        }

        // Real code execution engine integration via secure API backend
        async function runCode() {
            saveCurrentFileContent();
            let file = files[currentFile];
            let outputBox = document.getElementById("output-box");
            
            outputBox.innerText = `Compiling and executing ${currentFile}...\n`;

            try {
                let response = await fetch("https://emkc.org/api/v2/piston/execute", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language: file.lang,
                        version: "*",
                        files: [
                            {
                                name: currentFile,
                                content: file.content
                            }
                        ]
                    })
                });

                let data = await response.json();
                if (data.run) {
                    let resultOutput = data.run.output || data.run.stdout || data.run.stderr || "Program executed with no output.";
                    outputBox.innerText = resultOutput;
                } else {
                    outputBox.innerText = "Execution Error: " + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                outputBox.innerText = "Network Error: Failed to connect to execution sandbox. Check your internet connection.";
            }
        }

        // Resizable Splitter Logic for Workspace Layout
        function setupSplitters() {
            const workspace = document.getElementById("workspace");
            let activeSplitter = null;

            document.getElementById("splitter-1").onmousedown = (e) => { activeSplitter = 1; e.preventDefault(); };
            document.getElementById("splitter-2").onmousedown = (e) => { activeSplitter = 2; e.preventDefault(); };

            window.onmousemove = (e) => {
                if (!activeSplitter) return;
                let rect = workspace.getBoundingClientRect();

                if (activeSplitter === 1) {
                    let leftWidth = Math.max(150, Math.min(400, e.clientX - rect.left));
                    let currentCols = workspace.style.gridTemplateColumns.split(' ');
                    workspace.style.gridTemplateColumns = `${leftWidth}px 6px 1fr 6px ${currentCols[4]}`;
                } else if (activeSplitter === 2) {
                    let rightWidth = Math.max(200, Math.min(600, rect.right - e.clientX));
                    let currentCols = workspace.style.gridTemplateColumns.split(' ');
                    workspace.style.gridTemplateColumns = `${currentCols[0]} 6px 1fr 6px ${rightWidth}px`;
                }
            };

            window.onmouseup = () => { activeSplitter = null; };
        }

        window.onload = () => {
            initFileSystem();
            setupSplitters();
        };
    </script>
</body>
</html>
