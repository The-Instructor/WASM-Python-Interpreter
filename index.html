<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Wasm Workspace</title>
    
    <!-- Load CodeMirror 6 Bundle from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
    
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --border-color: #333333;
            --text-color: #dcdcdc;
            --accent-color: #0e639c;
            --success-color: #2ea44f;
            --danger-color: #a1260d;
            --hover-color: #2a2d2e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 48px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.run-btn {
            background-color: var(--success-color);
            color: white;
            font-weight: bold;
            border: none;
        }
        button.run-btn:hover {
            background-color: #2c974b;
        }
        button.run-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        button.stop-btn {
            background-color: #d12424;
            color: white;
            font-weight: bold;
            border: none;
        }
        button.stop-btn:hover {
            background-color: #b51a1a;
        }

        button.danger-btn {
            background-color: #333;
            color: #f85149;
            border-color: #555;
        }
        button.danger-btn:hover {
            background-color: #442222;
            border-color: #f85149;
        }

        .workspace {
            display: grid;
            grid-template-columns: 220px 6px 1fr 6px 380px;
            flex: 1;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        .pane {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background-color: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .splitter {
            background-color: var(--border-color);
            cursor: col-resize;
            transition: background 0.2s;
        }
        .splitter:hover, .splitter.active {
            background-color: var(--accent-color);
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        .file-item {
            padding: 9px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
        }
        .file-item:hover {
            background-color: var(--hover-color);
        }
        .file-item.active {
            background-color: #37373d;
            border-left-color: var(--accent-color);
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
        }
        
        /* CodeMirror Custom Styling to match IDE theme */
        .CodeMirror {
            flex: 1;
            height: auto !important;
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        .CodeMirror-gutters {
            background-color: var(--panel-bg) !important;
            border-right: 1px solid var(--border-color) !important;
        }
        .CodeMirror-linenumber {
            color: #666 !important;
        }

        .terminal-pane {
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            flex: 1;
            overflow: hidden;
        }
        .console-container {
            flex: 1;
            padding: 14px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }
    </style>
    
    <!-- CodeMirror Python Mode & Theme Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/python/python.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/seti.min.css">
</head><body><header>
<div class="toolbar-group"><strong>Python Wasm Workspace</strong></div>
<div class="toolbar-group"><button onclick="createNewFile()">+ New File</button> <button class="danger-btn" onclick="deleteCurrentFile()">🗑 Remove File</button> <button class="run-btn" id="run-btn" disabled="disabled" onclick="handleRunButtonClick()">Loading Python Worker...</button></div>
</header>
<div class="workspace" id="workspace">
<div class="pane">
<div class="pane-header">Files</div>
<ul class="file-list" id="file-list"></ul>
</div>
<div class="splitter" id="splitter-1"></div>
<div class="pane editor-container">
<div class="pane-header"><span id="current-filename">main.py</span> <span style="font-size: 10px; color: #888;">python</span></div>
<!-- CodeMirror Target --> <textarea id="code-editor"></textarea></div>
<div class="splitter" id="splitter-2"></div>
<div class="pane terminal-pane">
<div class="pane-header">Terminal Output</div>
<div class="console-container" id="output-box">Initializing background WebAssembly worker...</div>
</div>
</div>
<p><script>
        let files = {
            "main.py": {
                content: '# Test real-time streaming and loops\nimport time\n\nfor i in range(3):\n    print(f"Countdown: {{i}}")\n    time.sleep(0.5)\n\nprint("Finished successfully!")\n'
            }
        };

        let currentFile = "main.py";
        let worker = null;
        let codeMirrorEditor = null;
        let isRunning = false;

        // Construct the Web Worker environment inline via a Blob URL
        const workerScript = `
            importScripts("https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js");

            let pyodide = null;

            async function initPyodideWorker() {
                pyodide = await loadPyodide();
                
                // Stream stdout/stderr instantly back to main thread
                pyodide.setStdout({
                    batched: (msg) => postMessage({ type: 'stdout', data: msg + '\\n' })
                });
                pyodide.setStderr({
                    batched: (msg) => postMessage({ type: 'stderr', data: '\\n[stderr]: ' + msg + '\\n' })
                });

                postMessage({ type: 'ready' });
            }

            initPyodideWorker();

            self.onmessage = async (e) => {
                if (e.data.cmd === 'run') {
                    const { files, currentFile } = e.data;
                    try {
                        for (let filename in files) {
                            pyodide.FS.writeFile(filename, files[filename]);
                        }

                        let codeRunner = \`
import sys
import io

try:
    with open("\${{currentFile}}", "r") as f:
        code_content = f.read()
    
    compiled = compile(code_content, "\${{currentFile}}", "exec")
    exec(compiled, {"__name__": "__main__", "__file__": "\${{currentFile}}"})
except Exception:
    import traceback
    traceback.print_exc()
\`;
                        await pyodide.runPythonAsync(codeRunner);
                        postMessage({ type: 'done' });
                    } catch (err) {
                        postMessage({ type: 'error', data: '\\n[Execution Error]:\\n' + err });
                    }
                }
            };
        `;

        function spawnWorker() {
            const blob = new Blob([workerScript], { type: "application/javascript" });
            const workerUrl = URL.createObjectURL(blob);
            worker = new Worker(workerUrl);

            worker.onmessage = (e) => {
                const msg = e.data;
                if (msg.type === 'ready') {
                    const outputBox = document.getElementById("output-box");
                    const runBtn = document.getElementById("run-btn");
                    outputBox.innerText = "Python background worker ready. Click 'Run Code'.";
                    runBtn.innerText = "▶ Run Code";
                    runBtn.disabled = false;
                } else if (msg.type === 'stdout' || msg.type === 'stderr' || msg.type === 'error') {
                    appendOutput(msg.data);
                } else if (msg.type === 'done') {
                    appendOutput("\nProgram executed successfully.");
                    resetRunButton();
                }
            };
        }

        function appendOutput(text) {
            const outputBox = document.getElementById("output-box");
            outputBox.innerText += text;
            outputBox.scrollTop = outputBox.scrollHeight;
        }

        function initFileSystem() {
            const listEl = document.getElementById("file-list");
            listEl.innerHTML = "";
            for (let filename in files) {
                let li = document.createElement("li");
                li.className = `file-item ${filename === currentFile ? 'active' : ''}`;
                li.innerHTML = `<span>${{filename}}</span>`;
                li.onclick = () => selectFile(filename);
                listEl.appendChild(li);
            }
            
            if (codeMirrorEditor && files[currentFile]) {
                codeMirrorEditor.setValue(files[currentFile].content);
                document.getElementById("current-filename").innerText = currentFile;
            }
        }

        function saveCurrentFileContent() {
            if (files[currentFile] && codeMirrorEditor) {
                files[currentFile].content = codeMirrorEditor.getValue();
            }
        }

        function selectFile(filename) {
            saveCurrentFileContent();
            if (files[filename]) {
                currentFile = filename;
                initFileSystem();
            }
        }

        function createNewFile() {
            saveCurrentFileContent();
            let name = prompt("Enter filename (e.g., script.py or plain.txt):", "script.py");
            if (name) {
                name = name.trim();
                if (name && !files[name]) {
                    files[name] = { content: `# File: ${{name}}\n` };
                }
                selectFile(name);
            }
        }

        function deleteCurrentFile() {
            if (currentFile === "main.py") {
                alert("Cannot delete 'main.py' as it is the primary execution script.");
                return;
            }

            if (confirm(`Are you sure you want to delete '${{currentFile}}'?`)) {
                delete files[currentFile];
                currentFile = "main.py";
                initFileSystem();
            }
        }

        function handleRunButtonClick() {
            if (isRunning) {
                stopCode();
            } else {
                runCode();
            }
        }

        function stopCode() {
            if (worker) {
                worker.terminate(); // Instantly kills any infinite loop or stuck thread
            }
            appendOutput("\n\n[Execution Terminated by User]");
            resetRunButton();
            spawnWorker(); // Spin up a fresh worker thread
        }

        function resetRunButton() {
            isRunning = false;
            const runBtn = document.getElementById("run-btn");
            runBtn.className = "run-btn";
            runBtn.innerText = "▶ Run Code";
            runBtn.disabled = false;
        }

        function runCode() {
            saveCurrentFileContent();
            if (!worker || isRunning) return;

            isRunning = true;
            const outputBox = document.getElementById("output-box");
            const runBtn = document.getElementById("run-btn");

            runBtn.className = "stop-btn";
            runBtn.innerText = "⏹ Stop";
            runBtn.disabled = false;

            outputBox.innerText = `Executing ${{currentFile}}...\n\n`;

            // Extract file contents into a plain dictionary for the worker
            let filePayload = {};
            for (let f in files) {
                filePayload[f] = files[f].content;
            }

            worker.postMessage({
                cmd: 'run',
                files: filePayload,
                currentFile: currentFile
            });
        }

        function setupSplitters() {
            const workspace = document.getElementById("workspace");
            let activeSplitter = null;
            let leftWidth = 220;
            let rightWidth = 380;

            function updateGrid() {
                workspace.style.gridTemplateColumns = `${{leftWidth}}px 6px 1fr 6px ${{rightWidth}}px`;
                if (codeMirrorEditor) codeMirrorEditor.refresh();
            }

            document.getElementById("splitter-1").onmousedown = (e) => { activeSplitter = 1; e.preventDefault(); };
            document.getElementById("splitter-2").onmousedown = (e) => { activeSplitter = 2; e.preventDefault(); };

            window.onmousemove = (e) => {
                if (!activeSplitter) return;
                let rect = workspace.getBoundingClientRect();

                if (activeSplitter === 1) {
                    leftWidth = Math.max(150, Math.min(450, e.clientX - rect.left));
                } else if (activeSplitter === 2) {
                    rightWidth = Math.max(250, Math.min(600, rect.right - e.clientX));
                }
                updateGrid();
            };

            window.onmouseup = () => { activeSplitter = null; };
        }

        window.onload = () => {
            codeMirrorEditor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                mode: "python",
                theme: "seti",
                lineNumbers: true,
                indentUnit: 4,
                tabSize: 4,
                lineWrapping: false,
                autofocus: true
            });

            initFileSystem();
            setupSplitters();
            spawnWorker();
        };
    </script></p></body></html>
